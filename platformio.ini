[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = no_ota_8mb.csv
board_build.filesystem = littlefs

build_src_filter =
    +<main.cpp>
    +<hw/>
    +<ui/>
    +<anim/>
    +<audio/>
    +<model/>
    +<net/>
    +<boards/>

lib_deps =
    lewisxhe/XPowersLib
    lewisxhe/SensorLib
    adafruit/Adafruit BusIO
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
    olikraus/U8g2 @ ^2.35
    tzapu/WiFiManager @ ^2.0.17
    256dpi/MQTT @ ^2.5.2

[env:waveshare-esp32s3-touch-amoled-1-8]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
build_src_filter = ${env.build_src_filter}
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DXPOWERS_CHIP_AXP2101
    -DU8G2_USE_LARGE_FONTS
    -DESP32QSPI_MAX_PIXELS_AT_ONCE=8192
    ; 没这条时 sqrtf 走 libm 软件实现（编译器要保留 errno 语义，不敢内联成
    ; 硬件 SQRT.S）。鲸群每像素算一次椭圆距离，单这一项就吞掉 30 ms/帧。
    -fno-math-errno
    -O2
    -DBOARD_WAVESHARE_ESP32S3_TOUCH_AMOLED_1_8
    ; -DNOVA_SLIDE_EASE_QUART  ; 对比开关：水平滑屏改用 200ms outQuart（默认 180ms outCubic）
build_unflags = -Os

[env:waveshare-esp32s3-touch-amoled-1-75c]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DXPOWERS_CHIP_AXP2101
    -DU8G2_USE_LARGE_FONTS
    -DU8G2_FONT_SUPPORT
    -DBOARD_WAVESHARE_ESP32S3_TOUCH_AMOLED_1_75C

[env:waveshare-esp32c6-touch-amoled-2-16]
board = esp32-c6-devkitc-1
board_build.mcu = esp32c6
board_build.f_cpu = 160000000L
board_build.flash_mode = qio
; No psram_type, no arduino.memory_type — C6 has no PSRAM.
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DXPOWERS_CHIP_AXP2101
    -DU8G2_USE_LARGE_FONTS
    -DU8G2_FONT_SUPPORT
    -DBOARD_WAVESHARE_ESP32C6_TOUCH_AMOLED_2_16
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino @ ^2.0
lib_ignore =
    Adafruit_XCA9554
    Arduino_DriveBus

[env:waveshare-esp32s3-touch-amoled-2-16]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DXPOWERS_CHIP_AXP2101
    -DU8G2_USE_LARGE_FONTS
    -DU8G2_FONT_SUPPORT
    -DBOARD_WAVESHARE_ESP32S3_TOUCH_AMOLED_2_16
